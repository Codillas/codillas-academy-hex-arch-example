databaseChangeLog:
  - changeSet:
      id: 001-create-customers
      author: codillas-academy
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: customers_pk
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: customers
            columnNames: email
            constraintName: customers_email_uk
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE customers
              ADD CONSTRAINT customers_name_not_blank_ck CHECK (length(trim(name)) > 0)
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE customers
              ADD CONSTRAINT customers_email_not_blank_ck CHECK (length(trim(email)) > 0)
        - createIndex:
            tableName: customers
            indexName: customers_created_at_idx
            columns:
              - column:
                  name: created_at
                  descending: true
      rollback:
        - dropTable:
            tableName: customers
