databaseChangeLog:
  - changeSet:
      id: 002-create-products
      author: codillas-academy
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: products_pk
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE products
              ADD CONSTRAINT products_name_not_blank_ck CHECK (length(trim(name)) > 0)
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE products
              ADD CONSTRAINT products_price_positive_ck CHECK (price > 0)
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE products
              ADD CONSTRAINT products_updated_at_ck CHECK (updated_at >= created_at)
        - createIndex:
            tableName: products
            indexName: products_created_at_idx
            columns:
              - column:
                  name: created_at
                  descending: true
      rollback:
        - dropTable:
            tableName: products
