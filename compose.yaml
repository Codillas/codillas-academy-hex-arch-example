services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - orders-postgres-data:/var/lib/postgresql

volumes:
  orders-postgres-data:
