services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - commerce-postgres-data:/var/lib/postgresql

volumes:
  commerce-postgres-data:
